[project]
name = "portfolio-rag"
version = "0.1.0"
description = "CPU-only RAG knowledge-base QA with cited answers"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.2",
  "pypdf>=4.0",
  "numpy>=1.26",
  "rank-bm25>=0.2.2",
  "httpx>=0.27",
  "fastembed>=0.3",
  "pypdfium2>=4.30",  # server-side PDF page previews + highlight boxes
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: loads a real embedding model (needs MODEL_DIR populated or network)"]
addopts = "-m 'not slow'"
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
