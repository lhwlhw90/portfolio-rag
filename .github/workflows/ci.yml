name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.lock && pip install -e ".[dev]"
      - run: pytest -q                       # fast, offline (hash embedder)
      - run: pytest -q -m slow               # downloads bge-small (~65 MB) into ./models
        env: {MODEL_DIR: "${{ github.workspace }}/models", HF_HOME: "${{ github.workspace }}/models"}
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t portfolio-rag .
